<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目导航首页</title>
<style>
  :root{--bg:#0f1117;--card:#181b25;--border:#2a2e3a;--accent:#4a9eff;--text:#e4e6ef;--muted:#8b8fa3}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;line-height:1.7}
  .container{max-width:800px;margin:60px auto;padding:0 20px}
  h1{font-size:1.8em;margin-bottom:8px}
  .sub{color:var(--muted);font-size:.9em;margin-bottom:32px}
  .file-list{display:flex;flex-direction:column;gap:16px}
  .file-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 24px;text-decoration:none;color:var(--text);transition:border-color .2s}
  .file-card:hover{border-color:var(--accent)}
  .file-card .title{font-size:1.1em;font-weight:600;margin-bottom:4px}
  .file-card .desc{color:var(--muted);font-size:.85em}
  .file-card .meta{margin-top:8px;font-size:.78em;color:var(--muted)}
  .file-card .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7em;margin-right:4px;color:#fff}
  .tag-anime{background:#e74c3c}
  .tag-house{background:#3498db}
</style>
</head>
<body>
<div class="container">
  <h1>📊 项目导航</h1>
  <div class="sub">数据报告与可视化文件索引</div>
  <div class="file-list">
    <a class="file-card" href="dongman/index.html">
      <div class="title">🔥 动漫热榜排名报告</div>
      <div class="desc">覆盖全球热点/最新更新/AI漫剧/中国动漫 TOP20，含排名数据/波动分析/行业趋势/爆款拆解</div>
      <div class="meta"><span class="tag tag-anime">定时任务</span> 更新于 2026-08-06 · 调度规则: daily 08:35 · 数据来源: MAL/AnimeCorner/Reddit/红果/B站/腾讯视频</div>
    </a>
    <a class="file-card" href="fangjia/guanggu-east-2026h1.html">
      <div class="title">🏠 2026年上半年光谷东楼市多维度榜单</div>
      <div class="desc">含套数王/涨幅王/降价王三大排行榜及综合研判</div>
      <div class="meta"><span class="tag tag-house">定时任务</span> 更新于 2026-08-06 · 定时任务自动生成</div>
    </a>
  </div>
</div>
</body>
</html>
